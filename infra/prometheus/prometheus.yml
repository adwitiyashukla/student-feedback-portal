global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: student-feedback-portal

scrape_configs:
  - job_name: spring-boot-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: feedback-portal-backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

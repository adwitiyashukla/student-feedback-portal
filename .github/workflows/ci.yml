name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  PYTHON_VERSION: "3.12"

jobs:

  backend:
    name: Backend (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21"]

    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile
        working-directory: backend
        run: mvn -B clean compile

      - name: Tests, integration tests and coverage gate
        working-directory: backend
        run: mvn -B verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: backend/target/*-reports/TEST-*.xml
          check_name: Backend test results

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

  analytics:
    name: Analytics service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: analytics-service/requirements-dev.txt

      - name: Install dependencies
        working-directory: analytics-service
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: analytics-service
        run: ruff check .

      - name: Train model and enforce the accuracy gate
        working-directory: analytics-service
        run: python train.py

      - name: Tests
        working-directory: analytics-service
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: analytics-coverage
          path: analytics-service/coverage.xml
          retention-days: 14

  consistency:
    name: Repository consistency
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install checkers
        run: |
          pip install sqlglot pyyaml python-hcl2
          npm install --no-save java-parser

      - name: Verify
        run: NODE_PATH=$PWD/node_modules python scripts/verify.py

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, analytics, consistency]

    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: analytics
            context: ./analytics-service

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: sfp-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sfp-${{ matrix.service }}:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build Java sources for analysis
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: mvn -B clean compile -DskipTests

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  security:
    name: Dependency & secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan the filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

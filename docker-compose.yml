name: student-feedback-portal

services:

  mysql:
    image: mysql:8.4
    container_name: sfp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-feedback_portal}
      MYSQL_USER: ${MYSQL_USER:-feedback}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --max_connections=200
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    mem_limit: 900m
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [sfp-net]

  redis:
    image: redis:7.4-alpine
    container_name: sfp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    mem_limit: 320m
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [sfp-net]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: sfp-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [sfp-net]

  analytics:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: sfp-analytics
    restart: unless-stopped
    environment:
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-local-dev-analytics-key}
      ANALYTICS_MODEL_DIR: /app/data
      ANALYTICS_DEBUG: "false"
    ports:
      - "${ANALYTICS_PORT:-8000}:8000"
    mem_limit: 600m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sfp-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sfp-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      analytics:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-feedback_portal}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USERNAME: ${MYSQL_USER:-feedback}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM:-no-reply@university.edu}
      ANALYTICS_BASE_URL: http://analytics:8000
      ANALYTICS_API_KEY: ${ANALYTICS_API_KEY:-local-dev-analytics-key}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required - see .env.example}"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@university.edu}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
      STORAGE_TYPE: LOCAL
      STORAGE_LOCAL_PATH: /app/uploads
      APP_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    mem_limit: 1400m
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 90s
    networks: [sfp-net]

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: sfp-prometheus
    restart: unless-stopped
    depends_on:
      - backend
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [sfp-net]

  grafana:
    image: grafana/grafana:11.4.0
    container_name: sfp-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [sfp-net]

networks:
  sfp-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
  uploads:

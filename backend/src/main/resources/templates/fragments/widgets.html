<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<span th:fragment="statusBadge(status)"
      class="badge rounded-pill"
      th:classappend="${status.name() == 'OPEN'}             ? 'text-bg-primary'   :
                      (${status.name() == 'IN_PROGRESS'}     ? 'text-bg-info'      :
                      (${status.name() == 'AWAITING_STUDENT'}? 'text-bg-warning'   :
                      (${status.name() == 'RESOLVED'}        ? 'text-bg-success'   :
                      (${status.name() == 'CLOSED'}          ? 'text-bg-secondary' : 'text-bg-danger'))))"
      th:text="${#strings.replace(status.name(), '_', ' ')}">STATUS</span>

<span th:fragment="priorityBadge(priority)"
      class="badge"
      th:classappend="${priority.name() == 'URGENT'} ? 'text-bg-danger'  :
                      (${priority.name() == 'HIGH'}  ? 'text-bg-warning' :
                      (${priority.name() == 'MEDIUM'}? 'text-bg-info'    : 'text-bg-light text-dark'))"
      th:text="${priority.name()}">PRIORITY</span>

<span th:fragment="sentimentBadge(sentiment)" th:if="${sentiment != null}"
      class="badge"
      th:classappend="${sentiment.name() == 'POSITIVE'} ? 'text-bg-success' :
                      (${sentiment.name() == 'NEGATIVE'}? 'text-bg-danger'  : 'text-bg-secondary')"
      th:text="${sentiment.name()}">SENTIMENT</span>

<nav th:fragment="pager(page, baseUrl)" th:if="${page.totalPages > 1}" class="mt-3">
    <ul class="pagination pagination-sm justify-content-center">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.page - 1})}">Previous</a>
        </li>
        <li class="page-item disabled">
            <span class="page-link"
                  th:text="|Page ${page.page + 1} of ${page.totalPages} - ${page.totalElements} items|">Page</span>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${baseUrl}(page=${page.page + 1})}">Next</a>
        </li>
    </ul>
</nav>

<div th:fragment="statCard(label, value, tone)" class="col-6 col-lg-3">
    <div class="card stat-card border-0 shadow-sm h-100" th:classappend="'tone-' + ${tone}">
        <div class="card-body">
            <div class="text-body-secondary text-uppercase small fw-semibold" th:text="${label}">Label</div>
            <div class="display-6 fw-bold" th:text="${value}">0</div>
        </div>
    </div>
</div>

</body>
</html>

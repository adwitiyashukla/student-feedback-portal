<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(title, content, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} - Feedback Portal|">Feedback Portal</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm" sec:authorize="isAuthenticated()">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">
            <span class="brand-dot"></span> Feedback Portal
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/student/dashboard}">My feedback</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/student/feedback/new}">Submit feedback</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/feedback}">Queue</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','SUPER_ADMIN')">
                    <a class="nav-link" th:href="@{/admin/students}">Students</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/swagger-ui.html}" target="_blank" rel="noopener">API docs</a>
                </li>
            </ul>

            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item me-lg-3" th:if="${unreadCount != null and unreadCount > 0}">
                    <span class="badge text-bg-warning" th:text="|${unreadCount} new|">0 new</span>
                </li>
                <li class="nav-item me-lg-3">
                    <span class="navbar-text small" sec:authentication="principal.fullName">User</span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="btn btn-sm btn-outline-light" type="submit">Sign out</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="alert alert-success alert-dismissible fade show" role="alert"
         th:if="${successMessage}">
        <span th:text="${successMessage}">Done</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert"
         th:if="${errorMessage}">
        <span th:text="${errorMessage}">Something went wrong</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:replace="${content}">Page content</div>
</main>

<footer class="text-center text-body-secondary py-4 small">
    Student Feedback Portal v2.0 &middot;
    <a class="link-secondary" th:href="@{/actuator/health}">health</a> &middot;
    <a class="link-secondary" th:href="@{/swagger-ui.html}">API</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<th:block th:replace="${scripts}"></th:block>
</body>
</html>

spring:
  application:
    name: student-feedback-portal

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/feedback_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:feedback}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: feedback-portal-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  cache:
    type: redis
    redis:
      time-to-live: 300000
      cache-null-values: false

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  thymeleaf:
    cache: true
    mode: HTML
    encoding: UTF-8

  threads:
    virtual:
      enabled: true

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  compression:
    enabled: true
  shutdown: graceful

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:no-reply@university.edu}
  auto-close-after: 7d
  allowed-origins:
    - ${APP_BASE_URL:http://localhost:8080}

  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    issuer: student-feedback-portal
    lockout-duration: 15m

  analytics:
    enabled: ${ANALYTICS_ENABLED:true}
    base-url: ${ANALYTICS_BASE_URL:http://localhost:8000}
    api-key: ${ANALYTICS_API_KEY:}
    timeout: ${ANALYTICS_TIMEOUT:4s}

  storage:
    type: ${STORAGE_TYPE:LOCAL}
    local-path: ${STORAGE_LOCAL_PATH:./uploads}
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-south-1}
    max-file-size-bytes: 5242880

  bootstrap:
    enabled: ${BOOTSTRAP_ENABLED:true}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@university.edu}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

  rate-limit:
    enabled: true
    login-attempts-per-minute: 10
    api-requests-per-minute: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.adwitiya.feedbackportal: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
